# Local development database only — no Redis per project decision.
# Uses host port 5433 to avoid clashing with a local Postgres on 5432.
# Start with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: darkstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: darkstore
      POSTGRES_PASSWORD: darkstore
      POSTGRES_DB: darkstore
    ports:
      - "5433:5432"
    volumes:
      - darkstore_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkstore -d darkstore"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  darkstore_pg_data:
